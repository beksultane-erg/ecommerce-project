<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Магазин</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header__inner">

      <button class="burger" id="burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="drawer">
        <span></span><span></span><span></span>
      </button>

      <a href="/" class="logo" aria-label="На главную">
        <img class="logo__img" src="assets/images/logo.svg" alt="Логотип" width="640" height="168">
      </a>

      <button class="catalog">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span class="catalog__label">Каталог</span>
      </button>

      <form class="search" id="searchForm" role="search">
        <span class="search__icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-4-4"/>
          </svg>
        </span>
        <input class="search__input" type="search" placeholder="Поиск …" aria-label="Поиск">
        <button class="search__btn" type="submit">Найти</button>
      </form>

      <nav class="actions">
        <a href="#" aria-label="Сравнение">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v18M7 21h10M5 7h14"/>
            <path d="M5 7l-3 7a3 3 0 0 0 6 0L5 7zM19 7l-3 7a3 3 0 0 0 6 0l-3-7z"/>
          </svg>
        </a>
        <a href="#" aria-label="Профиль">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
          </svg>
        </a>
        <a href="#" aria-label="Корзина">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9h18l-2 11H5L3 9z"/>
            <path d="M8 9l3-5M16 9l-3-5M9 13v4M15 13v4"/>
          </svg>
        </a>
      </nav>

    </div>
  </header>

  <!-- ===== БОКОВОЕ МЕНЮ ===== -->
  <div class="overlay" id="overlay"></div>

  <aside class="drawer" id="drawer" aria-label="Меню" aria-hidden="true">
    <div class="drawer__head">
      <span class="drawer__title">Меню</span>
      <button class="drawer__close" id="drawerClose" aria-label="Закрыть меню">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <a href="#" class="drawer__login">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2d4fd6" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
      <span>
        <b>Войти или зарегистрироваться</b>
        <small>Чтобы видеть заказы и бонусы</small>
      </span>
    </a>

    <nav class="drawer__section">
      <div class="drawer__caption">Покупателям</div>
      <a href="#" class="drawer__link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7a3 3 0 1 0-3-3c0 2 3 3 3 3zm0 0a3 3 0 1 1 3-3c0 2-3 3-3 3z"/></svg>
        Акции и скидки
        <span class="drawer__badge">-30%</span>
      </a>
      <a href="#" class="drawer__link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4h14v12H1zM15 9h4l4 4v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        Доставка и оплата
      </a>
      <a href="#" class="drawer__link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Магазины на карте
      </a>
      <a href="#" class="drawer__link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        Рассрочка
      </a>
    </nav>

    <nav class="drawer__section">
      <div class="drawer__caption">Сервис</div>
      <a href="#" class="drawer__link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Гарантия и возврат
      </a>
      <a href="#" class="drawer__link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
        Ремонт техники
      </a>
      <a href="#" class="drawer__link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>
        Вопросы и ответы
      </a>
    </nav>

    <div class="drawer__footer">
      <a href="tel:+996000000000" class="drawer__phone">+996 (000) 00-00-00</a>
      <p>Ежедневно с 9:00 до 21:00</p>
    </div>
  </aside>

  <main class="page">
    <!-- контент страницы -->
  </main>

</body>
</html>
